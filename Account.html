   <link rel="stylesheet" href="stylesheet.css"> 
    <link rel="stylesheet" href="Stylesheet/Account.css">
</head>
<body>
    <nav class="navbar">
        <a href="Kezdolap.html" class="nav-bradning">Rózsatövis Étterem</a>
        <ul class="nav-menu">
            <li class="nav-item"><a class="nav-link" href="Kezdolap.html">Kezdőlap</a></li>
            <li class="nav-item"><a class="nav-link" href="Etlap.html">Étlap</a></li>

            <li class="nav-item"><a class="nav-link active" href="#">Bejelentkezés</a></li>
        </ul>
        <div class="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
        <script src="js.js"></script>
    </nav>

    <div class="container">
        <div class="wrapper">
            <div class="form-box login">
                <h2>Bejelentkezés</h2>
                <form action="#">
                    <div class="input-box">
                        <span class="icon"> <img src="kepek/mail_icon.svg" alt="E-mail ikon"></span>
                        <input type="email" required>
                        <label>E-mail</label>
                    </div>
                    <div class="input-box">
                        <span class="icon"> <img src="kepek/lock_icon.svg" alt="Lakat ikon"></span>
                        <input type="password" required>
                        <label>Jelszó</label>
                    </div>
                    <div class="forgot">
                        <label> <input type="checkbox"> Emlékezz rám </label>
                        <a href="#">Elfelejtettem a jelszavam</a>
                    </div>
                    <button type="submit" class="btn">Bejelentkezés</button>
                    <div class="login-register">
                        <p> Még nem regisztrált? <a href="#" class="register-link"> Regisztráció </a></p>
                    </div>
                </form>
            </div>

                <div class="form-box register">
                    <h2>Regisztráció</h2>
                    <form action="#">
                        <div class="input-box">
                            <span class="icon"> <img src="kepek/user_icon.svg" alt="E-mail ikon"></span>
                            <input type="text" required>
                            <label>Felhasználónév</label>
                        </div>
                        <div class="input-box">
                            <span class="icon"> <img src="kepek/mail_icon.svg" alt="E-mail ikon"></span>
                            <input type="email" required>
                            <label>E-mail</label>
                        </div>
                        <div class="input-box">
                            <span class="icon"> <img src="kepek/lock_icon.svg" alt="Lakat ikon"></span>
                            <input type="password" required>
                            <label>Jelszó</label>
                        </div>
                        <div class="forgot">
                            <label> <input type="checkbox"> Elfogadom a felhasználási feltételeket. </label>
                        </div>
                        <button type="submit" class="btn">Regisztráció</button>
                        <div class="login-register">
                            <p> Már van fiókom <a href="#" class="login-link"> Bejelentkezés </a></p>
                    </div>
                    </form>
            </div>
        </div>
    </div>
        <script src="Javascript/Account.js"></script>
</body>
</html>
